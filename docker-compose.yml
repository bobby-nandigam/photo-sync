# Local development stack: FastAPI backend + Vite/React frontend.
# No external database or Redis — sync state is a SQLite file on a volume.
services:
  backend:
    build: ./backend
    env_file: .env
    environment:
      # Dev defaults (override in .env if you like).
      OAUTH_REDIRECT_URI: http://localhost:8000/api/auth/google/callback
      FRONTEND_URL: http://localhost:5173
      CORS_ORIGINS: http://localhost:5173,http://localhost:8000
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend/app:/app/app
      - sync_data:/app/data
    ports:
      - "8000:8000"

  frontend:
    image: node:20-alpine
    working_dir: /app
    environment:
      BACKEND_URL: http://backend:8000
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  sync_data:
